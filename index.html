<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e96122"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dan Likes Chips"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="dan-icon-512.png" type="image/png" sizes="512x512"><link rel="apple-touch-icon" href="dan-icon-512.png"><title>Dan Likes Chips</title><style>
*{box-sizing:border-box}body{margin:0;background:#efdfc4;color:#45291a;font:15px/1.45 system-ui,sans-serif}#app{max-width:720px;margin:auto;background:#fff8e9;min-height:100dvh;display:flex;flex-direction:column}header{background:#e96122;color:#fff8e9;padding:calc(17px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px solid #b94319}h1{font-size:26px;letter-spacing:-1px;margin:0;line-height:1.1;font-weight:950}small,.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.wallet{background:#b94319;padding:9px 12px;border-radius:12px;font-weight:800;white-space:nowrap;font-size:13px}main{padding:16px;flex:1}h2{margin:0 0 6px;font-size:25px;letter-spacing:-.8px}h3{margin:0 0 5px;font-size:17px}p{margin:6px 0 12px}.muted{color:#88643f;font-size:12px}.scene{background:#f2d8ad;border:1px solid #e5c393;border-radius:17px;text-align:center;overflow:hidden}.scene .top{display:flex;justify-content:space-between;padding:12px 13px 0;color:#966035;align-items:center}.scene svg{display:block;width:100%;max-height:240px;margin:auto}.speech{background:#fffaf0;border:1px solid #e4c697;border-radius:11px;padding:10px 12px;margin:9px 12px 13px;font-weight:600}.panel{background:#fffaf0;border:1px solid #e5d0ad;border-radius:13px;padding:13px;margin:12px 0}.split{display:flex;justify-content:space-between;align-items:center;gap:9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0;font-size:12px;font-weight:750}.track{height:8px;background:#eadbbf;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#d28c36;border-radius:10px}.tag{background:#f3e3c7;padding:5px 9px;border-radius:14px;font-size:11px;font-weight:800;white-space:nowrap}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;min-height:44px}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #a56824;outline-offset:2px}.primary{background:#e96122;color:white;width:100%;border-radius:11px;padding:12px;font-weight:850;box-shadow:0 3px 0 #b94117}.secondary{background:#f4e3c8;color:#6d4527;border-radius:10px;padding:9px 12px;font-weight:750}.toast{text-align:center;font-size:12px;color:#a84a20;font-weight:750;min-height:20px;margin-top:9px}nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff3dd;border-top:1px solid #e5d0ad;padding:7px 3px calc(8px + env(safe-area-inset-bottom));z-index:3}nav button{background:none;border-radius:10px;color:#8b6946;font-size:10px;font-weight:750;padding:6px 0}nav button.active{background:#f6d9ae;color:#9b3417}nav span{display:block;font-size:23px}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.chip{display:flex;flex-direction:column;gap:6px;background:#fffaf0;border:1px solid #e5d0ad;border-radius:13px;padding:10px}.chip.selected,.outfit.selected{outline:2px solid #e96122}.art{background:#f7e7ca;border-radius:9px;display:grid;place-items:center;height:82px}.chip button{margin-top:auto;width:100%;font-size:12px}.chapter{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fffaf0;border:1px solid #e5d0ad;border-radius:12px;margin:8px 0;padding:12px;color:#45291a}.symbol{background:#efdfbf;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.chapter strong{display:block}.end{margin-left:auto}.story{background:#fffaf0;border:1px solid #e5d0ad;border-radius:14px;padding:17px;margin:13px 0}.story p{font:17px/1.7 Georgia,serif}.quote{background:#f2e4cb;border-radius:9px;padding:12px;font-style:italic}.choice{width:100%;background:#fffaf0;border:1px solid #e5d0ad;border-radius:11px;margin:7px 0;padding:13px;text-align:left;color:#45291a;font-weight:600}.choice.correct{background:#e4edce;border-color:#93a96d;opacity:1}.choice.wrong{background:#f7ddd2;border-color:#d69778;opacity:1}.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.outfit{background:#fffaf0;border:1px solid #e5d0ad;border-radius:10px;padding:10px 4px;color:#45291a;font-size:11px;font-weight:750}.outfit span{font-size:25px;display:block}.link{background:none;color:#986235;text-decoration:underline;padding:7px}.pop{animation:pop .4s ease-out;transform-origin:center}@keyframes pop{50%{transform:scale(1.07) rotate(-3deg)}}@media(min-width:550px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div id="app"></div><script>
const chips=[["Original Potato","The chip that started it all.",0,"#e7ac48",0],["Tortilla Chip","A magnificent triangle.",4,"#f1c653",1],["Patatas Fritas","A little taste of Spain.",8,"#d99c34",0],["Paprika Crisp","Smoky, bold, distinguished.",12,"#d97834",0],["Plantain Chip","A golden Caribbean classic.",16,"#eab83d",0],["Truffle Crisp","Financially irresponsible.",24,"#be9a65",0],["Abuela Special","Inspired by memories of home.",30,"#df9739",0],["Chip of Justice","Every bug deserves to be heard.",40,"#f7cf66",1]];
const chapters=[
["La Cocina de Abuela","Where it all began","🍳",0,"Before Dan had a career, a chip collection, or a single deadline, he had his abuelos. They cared for him while his mother worked. The kitchen smelled of tortilla and ropa vieja. His abuelo taught him dominoes. Spanish was the language of home.","Hay comida en casa. — There is food at home."],
["The Silent House","The memories that remained","🕯️",4,"When Dan was young, he lost both of his grandparents. He could not yet understand everything he had lost. As school and friendships filled his days, his Spanish gradually faded. Memories of their kitchen and domino games stayed with him.","Te recuerdo. — I remember you."],
["Across the Ocean","The journey to Spain","🌻",9,"As a young adult, Dan visited relatives in Spain and stood on the farmland where his abuelos had grown up. His family welcomed him warmly, but he struggled to communicate. He wanted to recover the language of his childhood.","Quiero volver a conectar. — I want to reconnect."],
["The Spreadsheet Years","A beetle in tax finance","📊",15,"Dan entered tax finance. His days became a blur of regulations, analyses, deadlines and vending-machine chips. He grew skilled in technology and AI, yet wondered whether his work was making the difference he wanted to make.","¿Cuál es mi propósito? — What is my purpose?"],
["The Father's Office","Technology meets humanity","💼",22,"Dan began helping his father's legal practice improve its systems. He learned how technology could serve people and watched his father explain complicated matters in Spanish. His work brought him closer to people whose needs were immediate and real.","Estoy aquí para ayudar. — I am here to help."],
["A Voice for Others","Discovering a calling","⚖️",30,"Dan saw his father help people navigate difficult moments with care and patience. Remembering his family's journey, he understood how much it mattered to be heard in one's own language. He decided to pursue law and continue rebuilding his Spanish.","Todos merecen ser escuchados. — Everyone deserves to be heard."],
["The Inheritance","A new chapter of life","🌅",40,"Dan's technical skills, research and ability to explain difficult ideas prepared him for a different future. He remembered the love his relatives offered him in Spain despite the language barrier. One day he hopes to carry on his father's practice and offer that same welcome to everyone.","Que todos se sientan escuchados. — May everyone feel heard."]];
const lessons=[["Me gustan las patatas fritas.",["I like potato chips.","I work in a kitchen.","My chips are missing."],0,"Dan's most important sentence."],["¿Dónde está mi familia?",["Where is the office?","Where is my family?","How much does this cost?"],1,"Familia means family."],["Quiero aprender español.",["I want to go to Spain.","I speak three languages.","I want to learn Spanish."],2,"Aprender means to learn."],["Estoy aquí para ayudar.",["I am here to help.","I am here to eat.","I need your help."],0,"A useful phrase when welcoming someone."],["¿Cómo se siente?",["Where do you live?","How are you feeling?","What is your name?"],1,"A respectful way to ask someone how they feel."],["Voy a escucharle.",["I will call you.","I will write to you.","I am going to listen to you."],2,"Listening is part of Dan's calling."],["Tiene derecho a hacer preguntas.",["You have the right to ask questions.","You need to sign this form.","Please wait outside."],0,"Derecho can mean a right."],["Nunca es demasiado tarde para aprender.",["Learning takes too long.","It is never too late to learn.","Tomorrow is another day."],1,"A reminder for anyone learning."]];
const outfits=[["Classic Dan","🐞",0],["Chef Dan","👨‍🍳",5],["Holiday Dan","👒",10],["Finance Dan","👔",15],["Attorney-to-be","⚖️",25],["Enlightened Dan","👑",40]];
const defaults={crumbs:0,xp:0,fed:0,owned:[0],selected:0,outfit:0,lesson:0,learned:[],read:[]};let s={...defaults};try{const saved=JSON.parse(localStorage.getItem("danchips-v1"));if(saved)s={...defaults,...saved}}catch(e){}let tab=0,chapter=null,answer=null,toast="",fedNow=false,timer;const root=document.getElementById("app");function save(){try{localStorage.setItem("danchips-v1",JSON.stringify(s))}catch(e){}}const level=()=>Math.floor(s.xp/10)+1;const rank=()=>s.xp>=40?"Bug with a Purpose":s.xp>=25?"Future Legal Beetle":s.xp>=15?"Career Reconsiderer":s.xp>=9?"Heritage Explorer":"Chip Enthusiast";const sayings=["I like chips. This is well documented.","frog and toad are friends","Me gustan las patatas fritas.","trash truck","ethnuffy","I like chips. hunny blanket","¿Dónde están mis patatas fritas?","A chip is a small edible possibility.","Abuela, tengo hambre.","¡Qué ricas están estas patatas!","My grandfather would have destroyed me at dominoes.","Necesito una siesta y unas patatas fritas.","Perhaps my purpose is greater than my appetite.","Hola. Soy Dan. Me gustan las patatas fritas.","I have a complicated relationship with spreadsheets.","Estoy aprendiendo. And snacking.","Un día seré abogado. Hoy quiero patatas fritas."];
const progress=n=>'<div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(n,100))+'%"></div></div>';
function chipArt(i,small=false){const c=chips[i],p=c[4]?'M12 72 Q8 78 18 82 L89 79 Q97 78 91 67 L56 10 Q51 3 46 13Z':'M10 41 C3 16 38 8 57 11 Q99 1 94 38 C110 67 75 88 51 83 C17 94 3 67 10 41Z';return '<svg viewBox="0 0 106 94" width="'+(small?49:86)+'" height="'+(small?44:72)+'"><path d="'+p+'" fill="'+c[3]+'" stroke="#ad7531" stroke-width="2.5"/>'+[[35,31],[64,32],[46,53],[71,59],[29,62]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.7" fill="#a66d2a" opacity=".5"/>').join('')+'<path d="M24 41 Q35 16 58 20" stroke="#fff0b0" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'}
function dan(){const hats=["","<path d='M84 42 L85 23 Q63 4 89 0 Q102 -10 113 4 Q136 -1 140 15 Q153 30 128 35 L126 44Z' fill='#fff7e3'/><path d='M85 36 L129 36'/>","<path d='M72 39 Q106 19 141 38 L134 44 L79 45Z' fill='#dfaa52'/><path d='M95 34 L99 13 Q115 6 128 18 L133 35Z' fill='#e6ba72'/>","<path d='M96 111 L111 117 L122 110 L119 132 L110 144 L103 129Z' fill='#304c65'/>","<path d='M83 41 L89 20 L129 20 L139 42Z' fill='#34383d'/><path d='M87 33 L134 33' stroke='#caa56d'/>","<path d='M82 38 L76 12 L97 24 L111 5 L127 24 L146 12 L138 38Z' fill='#f6c34d'/>"];return '<svg viewBox="0 0 300 190" role="img" aria-label="Dan the red beetle"><circle cx="245" cy="48" r="23" fill="#ffebba"/><path d="M0 143 Q80 123 148 142 T300 133 V190 H0Z" fill="#e7c18a"/><ellipse cx="157" cy="158" rx="96" ry="10" fill="#ad7748" opacity=".25"/><g class="'+(fedNow?'pop':'')+'" stroke="#452416" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round"><path d="M139 115 Q126 154 111 147 M169 119 Q162 161 148 155 M198 117 Q206 157 218 150 M226 105 Q248 137 257 130" fill="none"/><ellipse cx="186" cy="96" rx="64" ry="43" fill="#b92e1d"/><path d="M152 59 Q203 67 240 104" fill="none"/><path d="M101 66 Q96 28 76 28 M127 63 Q145 27 164 33" fill="none"/><ellipse cx="117" cy="99" rx="43" ry="39" fill="#e64f2b"/><circle cx="100" cy="90" r="16" fill="#fff4d8"/><circle cx="132" cy="90" r="16" fill="#fff4d8"/><circle cx="97" cy="91" r="6.5" fill="#432416" stroke="none"/><circle cx="129" cy="91" r="6.5" fill="#432416" stroke="none"/><path d="'+(fedNow?'M104 111 Q117 138 135 111Z':'M106 112 Q118 126 132 112')+'" fill="'+(fedNow?'#452416':'none')+'" stroke-width="3.5"/>'+hats[s.outfit]+'</g><g transform="translate('+(fedNow?55:23)+' 113) scale(.55)"><path d="M5 55 L28 1 Q33 -6 38 2 L68 60 Q71 68 61 68 L8 65Z" fill="#f8c34e" stroke="#875026" stroke-width="5"/><circle cx="30" cy="23" r="3" fill="#ce8b2e"/><circle cx="21" cy="44" r="3" fill="#ce8b2e"/><circle cx="48" cy="51" r="3" fill="#ce8b2e"/></g></svg>'}
const head=(t,p)=>'<h2>'+t+'</h2><p class="muted">'+p+'</p>';const btn=(action,label,cls='primary')=>'<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';
function home(){return '<div class="scene"><div class="top"><span class="eyebrow">Dan’s home</span><span class="tag">LVL '+level()+'</span></div>'+dan()+'<strong style="font-size:22px">Dan</strong><div class="muted">'+rank()+'</div><div class="speech">“'+(sayings[s.fed%sayings.length])+'”</div></div><div class="stats"><div><div class="split"><span>Chip happiness</span><span>'+Math.min(100,25+s.fed*8)+'%</span></div>'+progress(25+s.fed*8)+'</div><div><div class="split"><span>Life experience</span><span>'+s.xp+' XP</span></div>'+progress(s.xp%10*10)+'</div></div><div class="panel split"><div style="display:flex;align-items:center;gap:9px">'+chipArt(s.selected,true)+'<div><strong>'+chips[s.selected][0]+'</strong><div class="muted">Current snack</div></div></div><button class="secondary" data-tab="1">Change</button></div>'+btn('feed','Feed Dan a chip')+'<div class="toast" aria-live="polite">'+(toast||s.fed+' chips consumed. A life well crunched.')+'</div><div class="panel"><small>Dan’s greater purpose</small><h3>The road home</h3><p class="muted">'+s.read.length+' of 7 memories discovered.</p><button class="secondary" data-tab="2">Explore Dan’s story →</button></div>'}
function collection(){return head('The Chipendium',s.owned.length+' of 8 chips discovered. Earn crumbs by feeding Dan and practicing Spanish.')+'<div class="chips">'+chips.map((c,i)=>{let own=s.owned.includes(i);return '<div class="chip '+(s.selected===i?'selected':'')+'"><div class="art">'+chipArt(i)+'</div><strong>'+c[0]+'</strong><div class="muted">'+c[1]+'</div><button class="secondary" data-chip="'+i+'" '+(!own&&s.crumbs<c[2]?'disabled':'')+'>'+(s.selected===i?'✓ Equipped':own?'Equip':'Unlock · '+c[2]+' crumbs')+'</button></div>'}).join('')+'</div><div class="toast">'+toast+'</div>'}
function journey(){if(chapter!==null){let c=chapters[chapter];return btn('back','← All memories','link')+'<div class="story"><div style="font-size:42px">'+c[2]+'</div><small>Memory '+(chapter+1)+'</small><h2>'+c[0]+'</h2><p>'+c[4]+'</p><div class="quote">'+c[5]+'</div></div>'+btn(s.read.includes(chapter)?'back':'read',s.read.includes(chapter)?'Return to journey':'Remember this moment · +2 XP')}return head('The Road Home','Seven memories. One small bug discovering a much larger purpose.')+'<div class="panel"><div class="split"><strong>Dan’s journey</strong><span class="tag">'+s.read.length+'/7 memories</span></div>'+progress(s.read.length/7*100)+'</div>'+chapters.map((c,i)=>'<button class="chapter" data-chapter="'+i+'" '+(s.xp<c[3]?'disabled':'')+'><span class="symbol">'+(s.xp<c[3]?'🔒':c[2])+'</span><span><small>Chapter '+(i+1)+'</small><strong>'+c[0]+'</strong><span class="muted">'+(s.xp<c[3]?'Unlock at '+c[3]+' XP':c[1])+'</span></span><span class="end">'+(s.read.includes(i)?'✓':s.xp<c[3]?'':'›')+'</span></button>').join('')}
function spanish(){let l=lessons[s.lesson];return head('Español con Dan','Recover the language of home, one phrase at a time.')+'<div class="panel"><div class="split"><small>Phrase '+(s.lesson+1)+' of 8</small><span class="tag">'+s.learned.length+' mastered</span></div>'+progress(s.learned.length/8*100)+'<div style="font-size:30px;text-align:center;margin-top:21px">🇪🇸</div><div style="font-size:23px;font-weight:850;text-align:center;margin:12px 0">'+l[0]+'</div><p class="muted" style="text-align:center">What does this mean?</p></div>'+l[1].map((o,i)=>'<button class="choice '+(answer!==null&&i===l[2]?'correct':answer===i?'wrong':'')+'" data-answer="'+i+'" '+(answer!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+(answer!==null?'<div class="panel"><strong>'+(answer===l[2]?'¡Muy bien!':'Keep practicing, amigo.')+'</strong><p>'+l[3]+'</p></div>'+btn('next',s.lesson===7?'Practice again':'Next phrase →'):'')+'<div class="toast">'+toast+'</div>'}
function profile(){return head('The Many Dans','A distinguished beetle of considerable complexity.')+'<div class="scene">'+dan()+'<strong style="display:block;padding-bottom:13px">'+outfits[s.outfit][0]+'</strong></div><div class="outfits">'+outfits.map((o,i)=>'<button class="outfit '+(s.outfit===i?'selected':'')+'" data-outfit="'+i+'" '+(s.xp<o[2]?'disabled':'')+'><span>'+o[1]+'</span>'+o[0]+'<div class="muted">'+(s.xp<o[2]?o[2]+' XP':s.outfit===i?'Wearing':'Available')+'</div></button>').join('')+'</div><div class="panel"><h3>Dan’s life in numbers</h3>'+[['Lifetime chips eaten',s.fed],['Chips discovered',s.owned.length+'/8'],['Spanish phrases mastered',s.learned.length+'/8'],['Memories recovered',s.read.length+'/7'],['Career trajectory',rank()]].map(a=>'<div class="split" style="padding:9px 0;border-bottom:1px solid #efdfc4"><span class="muted">'+a[0]+'</span><strong style="font-size:12px">'+a[1]+'</strong></div>').join('')+'</div><div class="panel" style="text-align:center"><small>Dan’s mission statement</small><p style="font:17px Georgia">“May every bug who walks through my door feel heard.”</p><div class="muted">And may there always be chips.</div></div><div class="panel muted">Install on your phone: in Safari, tap Share → Add to Home Screen. On Android, open your browser menu and choose Install app or Add to Home Screen.</div>'}
function render(){root.innerHTML='<header><div><small>The official app</small><h1>Dan Likes Chips.</h1></div><div class="wallet">🟡 '+s.crumbs+' crumbs</div></header><main>'+[home,collection,journey,spanish,profile][tab]()+'</main><nav aria-label="Navigation">'+[['🏠','Home'],['🥔','Chips'],['📖','Journey'],['🇪🇸','Español'],['🐞','Dan']].map((a,i)=>'<button class="'+(tab===i?'active':'')+'" data-tab="'+i+'" aria-current="'+(tab===i?'page':'false')+'"><span>'+a[0]+'</span>'+a[1]+'</button>').join('')+'</nav>'}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;toast='';fedNow=false;if(d.tab!==undefined){tab=+d.tab;chapter=null;window.scrollTo(0,0)}else if(d.chip!==undefined){let i=+d.chip;if(!s.owned.includes(i)){if(s.crumbs<chips[i][2])return;s.crumbs-=chips[i][2];s.owned.push(i);s.xp+=2;toast='New chip discovered! +2 XP'}s.selected=i}else if(d.chapter!==undefined){if(s.xp>=chapters[+d.chapter][3])chapter=+d.chapter}else if(d.outfit!==undefined){if(s.xp>=outfits[+d.outfit][2])s.outfit=+d.outfit}else if(d.answer!==undefined){if(answer!==null)return;answer=+d.answer;if(answer===lessons[s.lesson][2]&&!s.learned.includes(s.lesson)){s.learned.push(s.lesson);s.xp+=3;s.crumbs+=3;toast='+3 XP · +3 crumbs'}}else if(d.action==='feed'){s.fed++;s.xp++;s.crumbs+=2;fedNow=true;toast='+2 crumbs · +1 XP · immeasurable joy';clearTimeout(timer);timer=setTimeout(()=>{fedNow=false;if(tab===0)render()},900)}else if(d.action==='back'){chapter=null}else if(d.action==='read'){if(chapter!==null&&!s.read.includes(chapter)){s.read.push(chapter);s.xp+=2}chapter=null}else if(d.action==='next'){s.lesson=(s.lesson+1)%8;answer=null}save();render()});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
