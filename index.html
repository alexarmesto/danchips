const chips=[["Original Potato","The chip that started it all.",0,"#e7ac48",0],["Tortilla Chip","A magnificent triangle.",4,"#f1c653",1],["Patatas Fritas","A little taste of Spain.",8,"#d99c34",0],["Paprika Crisp","Smoky, bold, distinguished.",12,"#d97834",0],["Plantain Chip","A golden Caribbean classic.",16,"#eab83d",0],["Truffle Crisp","Financially irresponsible.",24,"#be9a65",0],["Abuela Special","Inspired by memories of home.",30,"#df9739",0],["Chip of Justice","Every bug deserves to be heard.",40,"#f7cf66",1],["Sea Salt & Vinegar","An existentially sharp little crisp.",48,"#f0d8a1",2],["Jamón Ibérico Crisp","A taste of a Spanish summer.",56,"#d57c46",0],["Domino Chip","A tribute to Abuelo. Double six.",64,"#f2dfb4",3],["Frog & Toad Crisp","Best enjoyed in pairs, with a friend.",72,"#a9bd60",2],["Hunny Blanket Chip","Sweet, comforting, mysteriously spelled.",82,"#f5bb55",4],["Ethnuffy","Nobody knows what flavor this is.",94,"#a597d7",5],["Cosmic Crunch","The chip that heard the universe.",108,"#7699cb",1],["Trash Truck Special","An impossibly mighty, fully edible wheel.",128,"#71876a",6]];
const chapters=[
["La Cocina de Abuela","Where it all began","🍳",0,"Before Dan had a career, a chip collection, or a single deadline, he had his abuelos. They cared for him while his mother worked. The kitchen smelled of tortilla and ropa vieja. His abuelo taught him dominoes. Spanish was the language of home.","Hay comida en casa. — There is food at home."],
["The Silent House","The memories that remained","🕯️",4,"When Dan was young, he lost both of his grandparents. He could not yet understand everything he had lost. As school and friendships filled his days, his Spanish gradually faded. Memories of their kitchen and domino games stayed with him.","Te recuerdo. — I remember you."],
["Across the Ocean","The journey to Spain","🌻",9,"As a young adult, Dan visited relatives in Spain and stood on the farmland where his abuelos had grown up. His family welcomed him warmly, but he struggled to communicate. He wanted to recover the language of his childhood.","Quiero volver a conectar. — I want to reconnect."],
["The Spreadsheet Years","A beetle in tax finance","📊",15,"Dan entered tax finance. His days became a blur of regulations, analyses, deadlines and vending-machine chips. He grew skilled in technology and AI, yet wondered whether his work was making the difference he wanted to make.","¿Cuál es mi propósito? — What is my purpose?"],
["The Father's Office","Technology meets humanity","💼",22,"Dan began helping his father's legal practice improve its systems. He learned how technology could serve people and watched his father explain complicated matters in Spanish. His work brought him closer to people whose needs were immediate and real.","Estoy aquí para ayudar. — I am here to help."],
["A Voice for Others","Discovering a calling","⚖️",30,"Dan saw his father help people navigate difficult moments with care and patience. Remembering his family's journey, he understood how much it mattered to be heard in one's own language. He decided to pursue law and continue rebuilding his Spanish.","Todos merecen ser escuchados. — Everyone deserves to be heard."],
["The Inheritance","A new chapter of life","🌅",40,"Dan's technical skills, research and ability to explain difficult ideas prepared him for a different future. He remembered the love his relatives offered him in Spain despite the language barrier. One day he hopes to carry on his father's practice and offer that same welcome to everyone.","Que todos se sientan escuchados. — May everyone feel heard."],["The Domino Rematch","An unexpected friendship","🁫",49,"On a return visit to Spain, Dan joined a domino game in the village square. His Spanish was imperfect, but this time he stayed at the table. A frog and a toad offered him a chair. They became his friends. Dan could almost hear Abuelo laughing at his terrible opening move.","La amistad no necesita perfección. — Friendship does not need perfection."],["A Blanket Called Hunny","Rest is part of the journey","🧸",59,"Between his studies and work, Dan had begun to confuse exhaustion with accomplishment. One evening he found an old, honey-colored blanket. He wrapped himself in it, ate exactly three chips, and did absolutely nothing productive. The world continued turning. He named the blanket Hunny.","También necesito descansar. — I need to rest, too."],["The Case of Ethnuffy","The word nobody can define","🔎",70,"A strange word appeared in Dan's notebook: ethnuffy. Nobody knew what it meant. His frog and toad friends suggested a snack. His colleagues suggested a typo. Dan decided that some mysteries deserved curiosity rather than immediate resolution. Then the word appeared on a chip bag.","No entiendo, pero quiero aprender. — I do not understand, but I want to learn."],["The Little Law Office","The doors are open","⚖️",82,"Years later, in this imagined future, Dan opened the doors of his own practice. He put a bowl of chips in the waiting room and made sure people could speak in the language in which they felt most at home. He remembered how his family had welcomed him, and tried to offer that same warmth to every visitor.","Aquí todos son bienvenidos. — Everyone is welcome here."],["The Mountain of Crumbs","A civic responsibility","🏔️",95,"Dan discovered that years of snacking had produced a truly unreasonable quantity of empty chip bags. The neighborhood was in need of a cleanup. Dan assembled his friends, picked up a tiny broom, and realized that helping a community could take many forms. He heard a familiar rumble in the distance.","Cuidemos nuestro barrio. — Let us take care of our neighborhood."],["The Call of the Truck","An engine begins to stir","🚧",108,"A friendly green trash truck rolled up beside Dan. It collected the things nobody wanted to carry, and did so without complaint. Dan felt an inexplicable kinship. His antennae vibrated. His six little feet began to resemble wheels. Frog and Toad looked at each other. Hunny Blanket trembled.","Estoy listo para lo que viene. — I am ready for what comes next."],["TRASH TRUCK","The glorious final transformation","🚛",120,"At sunrise, Dan stood amid a perfectly clean neighborhood. He had found his roots, recovered his language, built a life of service, and eaten an unreasonable number of chips. Something clicked. His shell became a green compactor. His legs became magnificent wheels. His antennae remained, of course. He had not stopped being Dan. He had become Trash Truck. From the cab came one final declaration: I like chips. hunny blanket.","Sigo siendo Dan. Ahora soy un camión de basura. — I am still Dan. Now I am a trash truck."]];
const lessons=[["Me gustan las patatas fritas.",["I like potato chips.","I work in a kitchen.","My chips are missing."],0,"Dan's most important sentence."],["¿Dónde está mi familia?",["Where is the office?","Where is my family?","How much does this cost?"],1,"Familia means family."],["Quiero aprender español.",["I want to go to Spain.","I speak three languages.","I want to learn Spanish."],2,"Aprender means to learn."],["Estoy aquí para ayudar.",["I am here to help.","I am here to eat.","I need your help."],0,"A useful phrase when welcoming someone."],["¿Cómo se siente?",["Where do you live?","How are you feeling?","What is your name?"],1,"A respectful way to ask someone how they feel."],["Voy a escucharle.",["I will call you.","I will write to you.","I am going to listen to you."],2,"Listening is part of Dan's calling."],["Tiene derecho a hacer preguntas.",["You have the right to ask questions.","You need to sign this form.","Please wait outside."],0,"Derecho can mean a right."],["Nunca es demasiado tarde para aprender.",["Learning takes too long.","It is never too late to learn.","Tomorrow is another day."],1,"A reminder for anyone learning."],["Las ranas y los sapos son amigos.",["Frogs and toads are friends.","The frogs are hungry.","The toads drive cars."],0,"Ranas are frogs; sapos are toads."],["Necesito descansar.",["I need to work.","I need to rest.","I need to leave."],1,"Descansar means to rest."],["No entiendo esta palabra.",["I cannot find my keys.","I like this word.","I do not understand this word."],2,"Entender means to understand."],["Todos son bienvenidos aquí.",["Everyone is welcome here.","Everyone is leaving now.","Nobody is here."],0,"Bienvenidos means welcome."],["Vamos a limpiar el barrio.",["We are going to visit Spain.","Let us clean up the neighborhood.","We are going to eat chips."],1,"Barrio means neighborhood."],["¿Dónde está el camión de basura?",["Where is the potato?","Where is my blanket?","Where is the garbage truck?"],2,"Camión de basura means garbage truck."],["La amistad es un regalo.",["Friendship is a gift.","The gift is expensive.","My friend is sleeping."],0,"Amistad means friendship."],["Sigo siendo Dan.",["My name is not Dan.","I am still Dan.","Dan is driving away."],1,"Seguir + gerund expresses continuing an action."]];

nce is overwhelming.","El mundo necesita más amistad.","trash truck. the prophecy.","Some days you just need hunny blanket."];

function home(){return (finished()?'<div class="panel" style="text-align:center;background:#e4edce;border-color:#a1b980"><small>STORY COMPLETE</small><h3>🚛 Dan has become Trash Truck.</h3><p class="muted">The adventure continues. Collect every chip and compete with your friends.</p></div>':'')+ '<div class="scene"><div class="top"><span class="eyebrow">Dan’s home</span><span class="tag">LVL '+level()+'</span></div>'+dan()+'<strong style="font-size:22px">'+(s.outfit===outfits.length-1&&finished()?'Dan · Trash Truck':'Dan')+'</strong><div class="muted">'+rank()+'</div><div class="speech">“'+(s.outfit===outfits.length-1&&finished()?['trash truck','I like chips. hunny blanket','Sigo siendo Dan.','frog and toad are friends','ethnuffy','Beep beep. Tengo patatas fritas.'][s.fed%6]:sayings[s.fed%sayings.length])+'”</div></div><div class="stats"><div><div class="split"><span>Chip happiness</span><span>'+Math.min(100,25+s.fed*8)+'%</span></div>'+progress(25+s.fed*8)+'</div><div><div class="split"><span>Life experience</span><span>'+s.xp+' XP</span></div>'+progress(s.xp%10*10)+'</div></div><div class="panel split"><div style="display:flex;align-items:center;gap:9px">'+chipArt(s.selected,true)+'<div><strong>'+chips[s.selected][0]+'</strong><div class="muted">Current snack</div></div></div><button class="secondary" data-tab="1">Change</button></div>'+btn('feed','Feed Dan a chip')+'<div class="toast" aria-live="polite">'+(toast||s.fed+' chips consumed. A life well crunched.')+'</div><div class="panel"><small>Dan’s greater purpose</small><h3>The road home</h3><p class="muted">'+s.read.length+' of '+chapters.length+' memories discovered.</p><button class="secondary" data-tab="2">Explore Dan’s story →</button></div>'}
function collection(){return head('The Chipendium',s.owned.length+' of '+chips.length+' chips discovered. Earn crumbs by feeding Dan and practicing Spanish.')+'<div class="chips">'+chips.map((c,i)=>{let own=s.owned.includes(i);return '<div class="chip '+(s.selected===i?'selected':'')+'"><div class="art">'+chipArt(i)+'</div><strong>'+c[0]+'</strong><div class="muted">'+c[1]+'</div><button class="secondary" data-chip="'+i+'" '+(!own&&s.crumbs<c[2]?'disabled':'')+'>'+(s.selected===i?'✓ Equipped':own?'Equip':'Unlock · '+c[2]+' crumbs')+'</button></div>'}).join('')+'</div><div class="toast">'+toast+'</div>'}
function journey(){if(chapter!==null){let c=chapters[chapter];return btn('back','← All memories','link')+'<div class="story"><div style="font-size:42px">'+c[2]+'</div><small>Memory '+(chapter+1)+'</small><h2>'+c[0]+'</h2><p>'+c[4]+'</p><div class="quote">'+c[5]+'</div></div>'+btn(s.read.includes(chapter)?'back':'read',s.read.includes(chapter)?'Return to journey':chapter===chapters.length-1?'Become Trash Truck · +100 crumbs':'Remember this moment · +2 XP')}return head('The Road Home','Fourteen memories. One small bug discovering a much larger purpose.')+(finished()?'<div class="panel" style="background:#e4edce"><strong>🚛 The journey is complete.</strong><p class="muted">Trash Truck is unlocked forever. Revisit your memories anytime.</p></div>':'')+'<div class="panel"><div class="split"><strong>Dan’s journey</strong><span class="tag">'+s.read.length+'/'+chapters.length+' memories</span></div>'+progress(s.read.length/chapters.length*100)+'</div>'+chapters.map((c,i)=>'<button class="chapter" data-chapter="'+i+'" '+(!chapterOpen(i)?'disabled':'')+'><span class="symbol">'+(!chapterOpen(i)?'🔒':c[2])+'</span><span><small>Chapter '+(i+1)+'</small><strong>'+c[0]+'</strong><span class="muted">'+(!chapterOpen(i)?(s.xp<c[3]?'Unlock at '+c[3]+' XP':'Read all previous memories first'):c[1])+'</span></span><span class="end">'+(s.read.includes(i)?'✓':!chapterOpen(i)?'':'›')+'</span></button>').join('')}
function spanish(){let l=lessons[s.lesson];return head('Español con Dan','Recover the language of home, one phrase at a time.')+'<div class="panel"><div class="split"><small>Phrase '+(s.lesson+1)+' of '+lessons.length+'</small><span class="tag">'+s.learned.length+' mastered</span></div>'+progress(s.learned.length/lessons.length*100)+'<div style="font-size:30px;text-align:center;margin-top:21px">🇪🇸</div><div style="font-size:23px;font-weight:850;text-align:center;margin:12px 0">'+l[0]+'</div><p class="muted" style="text-align:center">What does this mean?</p></div>'+l[1].map((o,i)=>'<button class="choice '+(answer!==null&&i===l[2]?'correct':answer===i?'wrong':'')+'" data-answer="'+i+'" '+(answer!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+(answer!==null?'<div class="panel"><strong>'+(answer===l[2]?'¡Muy bien!':'Keep practicing, amigo.')+'</strong><p>'+l[3]+'</p></div>'+btn('next',s.lesson===lessons.length-1?'Practice again':'Next phrase →'):'')+'<div class="toast">'+toast+'</div>'}
function profile(){return head('The Many Dans','A distinguished beetle of considerable complexity.')+'<div class="scene">'+dan()+'<strong style="display:block;padding-bottom:13px">'+outfits[s.outfit][0]+'</strong></div><div class="outfits">'+outfits.map((o,i)=>'<button class="outfit '+(s.outfit===i?'selected':'')+'" data-outfit="'+i+'" '+(!outfitOpen(i)?'disabled':'')+'><span>'+o[1]+'</span>'+o[0]+'<div class="muted">'+(!outfitOpen(i)?(i===outfits.length-1?'Complete the journey':o[2]+' XP'):s.outfit===i?'Wearing':'Available')+'</div></button>').join('')+'</div><div class="panel"><h3>Dan’s life in numbers</h3>'+[['Lifetime chips eaten',s.fed],['Chips discovered',s.owned.length+'/'+chips.length],['Spanish phrases mastered',s.learned.length+'/'+lessons.length],['Memories recovered',s.read.length+'/'+chapters.length],['Career trajectory',rank()]].map(a=>'<div class="split" style="padding:9px 0;border-bottom:1px solid #efdfc4"><span class="muted">'+a[0]+'</span><strong style="font-size:12px">'+a[1]+'</strong></div>').join('')+'</div><div class="panel" style="text-align:center"><small>Dan’s mission statement</small><p style="font:17px Georgia">“May every bug who walks through my door feel heard.”</p><div class="muted">And may there always be chips.</div></div><div class="panel muted">Install on your phone: in Safari, tap Share → Add to Home Screen. On Android, open your browser menu and choose Install app or Add to Home Screen.</div>'}

const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!s.playerId){s.playerId=globalThis.crypto?.randomUUID?.()||Array.from({length:4},()=>Math.random().toString(36).slice(2)).join('');save()}
let incoming=null,socialMode='board';
function parseCard(raw){try{let v=raw.trim();if(v.includes('#friend='))v=v.split('#friend=')[1];else v=v.replace(/^friend=/,'');const a=JSON.parse(decodeURIComponent(v));if(a.v!==1||typeof a.id!=='string'||! /^[a-zA-Z0-9-]{8,80}$/.test(a.id)||typeof a.name!=='string'||!a.name.trim()||a.name.length>30||!Number.isSafeInteger(a.chips)||a.chips<0||!Number.isSafeInteger(a.at)||a.at<0||a.at>Date.now()+86400000)throw Error();return a}catch(e){return null}}
function makeLink(){let card={v:1,id:s.playerId,name:s.playerName||'Chip Fan',chips:s.fed,at:Date.now()};return location.origin+location.pathname+'#friend='+encodeURIComponent(JSON.stringify(card))}
function importFriend(raw){let a=parseCard(raw);if(!a){toast='That is not a valid Dan friend link.';return}if(a.id===s.playerId){toast='That is your own friend link!';return}incoming=a;socialMode='friends';}
function social(){if(globalThis.danOnlineSocial)return globalThis.danOnlineSocial();
const entries=[{id:s.playerId,name:s.playerName||'Chip Fan',chips:s.fed,me:true},...s.friends].sort((a,b)=>b.chips-a.chips||a.name.localeCompare(b.name));
const top=entries[0],myRank=entries.findIndex(a=>a.me)+1;
let board='<div class="panel" style="text-align:center;background:#f5dfb4"><div style="font-size:38px">🏆</div><small>THE CRUNCH CHAMPION</small><h2 style="margin:5px 0">'+esc(top.name)+(top.me?' (you)':'')+'</h2><strong style="font-size:26px">'+top.chips.toLocaleString()+'</strong><div class="muted">lifetime chips eaten</div></div><div class="panel"><div class="split"><h3>Friends leaderboard</h3><span class="tag">Your rank #'+myRank+'</span></div>'+entries.map((a,i)=>'<div class="friendrow"><div class="ranknum">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1))+'</div><div class="avatar">🐞</div><div style="flex:1;min-width:0"><strong style="overflow-wrap:anywhere">'+esc(a.name)+'</strong><div class="muted">'+(a.me?'You · current score':'Shared '+esc(new Date(a.at).toLocaleDateString()))+'</div></div><strong style="font-variant-numeric:tabular-nums">'+a.chips.toLocaleString()+' 🥔</strong></div>').join('')+'</div>'+(s.friends.length?'':'<div class="panel"><h3>It’s lonely at the top.</h3><p class="muted">Invite a friend and exchange your chip scores.</p>'+btn('socialfriends','Add a friend')+'</div>');
let friends='<div class="panel"><h3>Your player card</h3><label for="playerName" class="muted">Choose a nickname (shared with friends)</label><div class="split" style="margin-top:6px"><input class="socialinput" id="playerName" maxlength="30" autocomplete="off" placeholder="Chip Fan" value="'+esc(s.playerName||'')+'">'+btn('savename','Save','secondary')+'</div><p class="muted">Your current score: '+s.fed.toLocaleString()+' lifetime chips.</p>'+btn('sharefriend','Share my friend link')+'<div style="margin-top:10px">'+btn('copyfriend','Copy friend link','secondary')+'</div></div><div class="panel"><h3>Add a friend</h3><label for="friendLink" class="muted">Paste a friend’s Dan Likes Chips link.</label><textarea class="socialinput" id="friendLink" rows="3" maxlength="3000" placeholder="Paste their link here"></textarea>'+btn('importfriend','Find friend')+'</div>';
if(incoming)friends+='<div class="panel"><small>Friend found</small><h3>'+esc(incoming.name)+'</h3><p>'+incoming.chips.toLocaleString()+' chips · shared '+esc(new Date(incoming.at).toLocaleDateString())+'</p>'+btn('acceptfriend',s.friends.some(a=>a.id===incoming.id)?'Update friend score':'Add friend')+'<div style="margin-top:8px">'+btn('cancelFriend','Cancel','secondary')+'</div></div>';
friends+='<div class="panel"><h3>My friends · '+s.friends.length+'</h3>'+(s.friends.length?s.friends.map((a,i)=>'<div class="friendrow"><div class="avatar">🐞</div><div style="flex:1;min-width:0"><strong style="overflow-wrap:anywhere">'+esc(a.name)+'</strong><div class="muted">'+a.chips.toLocaleString()+' chips · '+esc(new Date(a.at).toLocaleDateString())+'</div></div><button class="secondary" data-removefriend="'+i+'">Remove</button></div>').join(''):'<p class="muted">No friends yet. Share your link to get started.</p>')+'</div>';
return head('The Chip Club','A very serious competition for very unserious bugs.')+'<div class="socialtabs">'+btn('socialboard','🏆 Leaderboard',socialMode==='board'?'primary':'secondary')+btn('socialfriends','🐞 Friends',socialMode==='friends'?'primary':'secondary')+'</div>'+(socialMode==='board'?board:friends)+'<div class="toast" aria-live="polite">'+esc(toast)+'</div><p class="muted">Friends and scores are stored on this device. Your score updates as you play; friends’ scores update when you exchange fresh links. Shared scores are self-reported, not verified. No account or live server is used.</p>'
}
async function shareCard(copyOnly){let url=makeLink();try{if(!copyOnly&&navigator.share){await navigator.share({title:'Dan Likes Chips',text:'Add me to your Chip Club!',url});return}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);toast='Friend link copied! Send it to a friend.';render();return}}catch(e){if(e.name==='AbortError')return}window.prompt('Copy this friend link:',url)}
if(location.hash.startsWith('#friend=')){importFriend(location.hash.slice(1));tab=5;}

function render(){root.innerHTML='<header><div><small>The official app</small><h1>Dan Likes Chips.</h1></div><div class="wallet">🟡 '+s.crumbs+' crumbs</div></header><main>'+[home,collection,journey,spanish,profile,social][tab]()+'</main><nav aria-label="Navigation">'+[['🏠','Home'],['🥔','Chips'],['📖','Journey'],['🇪🇸','Español'],['🐞','Dan'],['🏆','Club']].map((a,i)=>'<button class="'+(tab===i?'active':'')+'" data-tab="'+i+'" aria-current="'+(tab===i?'page':'false')+'"><span>'+a[0]+'</span>'+a[1]+'</button>').join('')+'</nav>'}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;toast='';fedNow=false;if(d.tab!==undefined){tab=+d.tab;chapter=null;window.scrollTo(0,0)}else if(d.removefriend!==undefined){let i=+d.removefriend;if(s.friends[i]&&confirm('Remove '+s.friends[i].name+' from your friends?')){s.friends.splice(i,1);toast='Friend removed.'}}else if(d.action==='socialfriends'){socialMode='friends'}else if(d.action==='socialboard'){socialMode='board'}else if(d.action==='savename'){s.playerName=document.getElementById('playerName').value.trim().slice(0,30);toast='Nickname saved.'}else if(d.action==='sharefriend'||d.action==='copyfriend'){shareCard(d.action==='copyfriend');return}else if(d.action==='importfriend'){importFriend(document.getElementById('friendLink').value)}else if(d.action==='acceptfriend'){if(incoming){let i=s.friends.findIndex(a=>a.id===incoming.id);if(i<0){s.friends.push(incoming);toast='Friend added!'}else if(incoming.at>=s.friends[i].at){s.friends[i]=incoming;toast='Friend score updated!'}else toast='You already have a newer score.';incoming=null;history.replaceState(null,'',location.pathname+location.search);socialMode='board'}}else if(d.action==='cancelFriend'){incoming=null;history.replaceState(null,'',location.pathname+location.search)}else if(d.chip!==undefined){let i=+d.chip;if(!s.owned.includes(i)){if(s.crumbs<chips[i][2])return;s.crumbs-=chips[i][2];s.owned.push(i);s.xp+=2;toast='New chip discovered! +2 XP'}s.selected=i}else if(d.chapter!==undefined){if(chapterOpen(+d.chapter))chapter=+d.chapter}else if(d.outfit!==undefined){if(outfitOpen(+d.outfit))s.outfit=+d.outfit}else if(d.answer!==undefined){if(answer!==null)return;answer=+d.answer;if(answer===lessons[s.lesson][2]&&!s.learned.includes(s.lesson)){s.learned.push(s.lesson);s.xp+=3;s.crumbs+=3;toast='+3 XP · +3 crumbs'}}else if(d.action==='feed'){s.fed++;s.xp++;s.crumbs+=2;fedNow=true;toast='+2 crumbs · +1 XP · immeasurable joy';clearTimeout(timer);timer=setTimeout(()=>{fedNow=false;if(tab===0)render()},900)}else if(d.action==='back'){chapter=null}else if(d.action==='read'){if(chapter!==null&&chapterOpen(chapter)&&!s.read.includes(chapter)){s.read.push(chapter);s.xp+=2;if(chapter===chapters.length-1){s.outfit=outfits.length-1;s.crumbs+=100;toast='TRASH TRUCK UNLOCKED! +100 crumbs';tab=0;window.scrollTo(0,0)}}chapter=null}else if(d.action==='next'){s.lesson=(s.lesson+1)%lessons.length;answer=null}save();render()});window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#friend=')){importFriend(location.hash.slice(1));tab=5;render()}});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="online.js"></script></body></html>
